name: Git Repository Mirror Backup

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 04:00 UTC (01:00 BRT)
    - cron: "0 4 * * *"

jobs:
  backup-mirror:
    name: Execute Git Mirror Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Execute Backup Mirror Engine
        run: npm run start
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
