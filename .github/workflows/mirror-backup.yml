name: Git Repository Mirror Backup

on:
  workflow_dispatch:
  # NOTE: Native GitHub Actions 'schedule' (cron) events are placed in a low-priority shared queue
  # that can experience multi-hour delays during peak loads. To guarantee strict execution within
  # the 04:00-05:00 BRT maintenance window, this workflow is triggered via the GitHub REST API
  # ('workflow_dispatch' high-priority queue) using Google Apps Script (see scripts/gas-trigger.template.js)
  # or any compatible external cron scheduler.
  # Uncomment the 'schedule' block below if you prefer native GitHub Actions cron scheduling:
  # schedule:
  #   - cron: "37 6 * * *"

jobs:
  backup-mirror:
    name: Execute Git Mirror Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Execute Backup Mirror Engine
        run: npm run start
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
